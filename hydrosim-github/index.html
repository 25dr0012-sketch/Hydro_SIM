<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="mark.png"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HydroSIM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">
/* VOICE: calm, scholarly, precise — a hydraulics lab's own page
   IDEA: a river confluence — two channels meeting, the subject of his research
   PICTURE: full-width plan view of a right-angled open-channel junction with moving streamlines
   COLOUR and TYPE: deep river teal fields, white, sediment ochre accent; Source Serif 4 + IBM Plex Sans
   LAYOUT: river band, profile card overlapping it, then sections on a 1180px column */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0a1a1d);--ink:light-dark(#11272c,#e4efee);--muted:light-dark(#4f666b,#9fb6b8);--line:light-dark(#d8e3e3,#21393e);--soft:light-dark(#f1f6f6,#10262a);--land:light-dark(#0d4d59,#0b3740);--water:light-dark(#2e8c97,#1f6c76);--silt:light-dark(#b8741f,#e0a052);--card:light-dark(#fff,#0f2327)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
html{scroll-padding-top:72px;scroll-behavior:smooth}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:650;line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:clamp(28px,3.4vw,38px);margin-bottom:22px}
h3{font-size:19px;font-weight:600;margin:26px 0 12px}
a{color:var(--water)}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(36px,5vw,72px) 0;border-top:1px solid var(--line)}
.band.alt{background:var(--soft)}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--land) 96%,transparent);color:#fff;backdrop-filter:blur(6px)}
nav .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{font-family:"Source Serif 4",serif;font-weight:650;font-size:18px;white-space:nowrap;color:#fff;text-decoration:none}
.links{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.links a{flex:none;color:#d7ecee;text-decoration:none;padding:10px 10px;font-size:15px;border-radius:6px}
.links a:hover,.links a:focus-visible{background:#ffffff1f;color:#fff}
button{font:inherit;cursor:pointer;border-radius:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button:focus-visible,a:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--silt);outline-offset:2px}
.btn-edit{background:#fff;color:var(--land);border:0;font-weight:600;flex:none}
.hero{position:relative;height:clamp(240px,32vw,420px);background:var(--land);overflow:hidden}
.hero svg,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,#0006);pointer-events:none}
.flowfig{margin:0 0 36px}
.flowfig video{width:100%;aspect-ratio:1280/432;object-fit:cover;border-radius:12px;display:block;background:var(--land)}
.flowfig figcaption{color:var(--muted);font-size:15px;margin-top:10px;max-width:80ch}
.vidtools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.flow{stroke-dasharray:14 20;animation:run 2.6s linear infinite}
@keyframes run{to{stroke-dashoffset:-68}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.intro{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(24px,4vw,56px);margin-top:-90px;position:relative;padding-bottom:56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 14px 40px #0b2e3426;align-self:start}
.photo{width:100%;aspect-ratio:4/5;border-radius:10px;object-fit:cover;display:block;background:var(--soft)}
.ph{display:grid;place-items:center;font:600 64px "Source Serif 4",serif;color:#fff;background:linear-gradient(160deg,var(--water),var(--land))}
.card h1{font-size:clamp(30px,3vw,36px);margin:18px 0 6px}
.role{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;text-decoration:none;color:var(--ink);background:var(--card)}
a.chip:hover{border-color:var(--water)}
.about{padding-top:110px}
.about p{max-width:68ch;margin:0 0 14px;font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tag{background:var(--soft);border-left:3px solid var(--silt);padding:6px 12px;border-radius:4px;font-size:15px}
.notice{margin-top:24px;border:1px solid var(--silt);background:color-mix(in srgb,var(--silt) 10%,var(--bg));border-radius:10px;padding:16px 18px;max-width:68ch}
.notice b{display:block;margin-bottom:4px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;position:relative}
.box h3{margin:0 0 8px;font-size:18px}
.box p{margin:0;color:var(--muted);font-size:15px}
.person{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.avatar.ph{font-size:24px;background:linear-gradient(160deg,var(--water),var(--land))}
.person b{display:block;font-size:17px}
.person span{display:block;color:var(--muted);font-size:14px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:18px;padding:14px 0;border-top:1px solid var(--line);position:relative}
.rows li:first-child{border-top:0}
.yr{font-family:"Source Serif 4",serif;font-weight:650;font-size:20px;color:var(--water);white-space:nowrap}
.sub{color:var(--muted);font-size:14px;display:block}
.news li .yr{font-size:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(24px,4vw,56px)}
.plain{margin:0;padding-left:20px}.plain li{margin:6px 0;position:relative}
.money{white-space:nowrap;font-weight:600;color:var(--ink)}
.status{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--soft);white-space:nowrap}
.gallery{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.gallery figure{margin:0;position:relative}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}
.gallery figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center}
.contact{background:var(--land);color:#e4f1f2;border:0}
.contact h2{color:#fff}.contact a{color:#fff}
.contact .two p{margin:0 0 10px}
footer{background:var(--land);color:#a9cdd1;font-size:14px;padding:18px 0;border-top:1px solid #ffffff22}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;flex:none;border-radius:50%;box-shadow:0 0 0 2px #ffffff40}
.hero.big .herotext{display:flex;align-items:flex-end;gap:clamp(16px,3vw,32px)}.emblem{width:clamp(92px,15vw,190px);height:auto;flex:none;filter:drop-shadow(0 8px 22px #0008)}
.mapbox{margin-top:28px}.mapbox iframe{display:block;width:100%;height:clamp(280px,40vw,420px);border:0;border-radius:14px;background:#0b3740}
.mapcard{display:flex;align-items:center;gap:16px;padding:22px;border-radius:14px;background:#ffffff14;border:1px solid #ffffff33}.mapcard svg{width:44px;height:44px;color:var(--silt);flex:none}.mapcard b{display:block;font-size:19px;color:#fff}.mapcard span{color:#cfe6e8}
.mapbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.mapbtn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:10px;background:var(--silt);color:#fff!important;text-decoration:none;font-weight:600}.mapbtn.ghost{background:transparent;border:1px solid #ffffff66}
.hero canvas.fluid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;touch-action:pan-y;cursor:crosshair;display:block}.hero.live video{display:none}.hero.live{touch-action:pan-y}
.herotext{pointer-events:none}.herotext [contenteditable]{pointer-events:auto}
.fluidhint{position:absolute;right:max(4vw,16px);top:16px;z-index:2;background:#0a2a2fcc;color:#fff;font-size:13px;padding:7px 14px;border-radius:999px;pointer-events:none;animation:hint 2.4s ease-in-out infinite}@keyframes hint{50%{opacity:.55}}
.foot-emblem{display:block;width:clamp(96px,12vw,140px);height:auto;margin:36px auto 0}
.links a[aria-current]{background:#ffffff26;color:#fff}
.hero.big{height:clamp(300px,40vw,500px)}.hero.small{height:clamp(170px,20vw,240px)}
.herotext{position:absolute;left:0;right:0;bottom:0;z-index:1;padding-bottom:clamp(18px,3vw,36px);color:#fff}
.herotext h1{color:#fff;font-size:clamp(36px,5.4vw,64px);text-shadow:0 2px 18px #0009}
.herotext p{margin:8px 0 0;font-size:clamp(15px,1.6vw,19px);color:#e6f3f4;text-shadow:0 1px 10px #0009;max-width:60ch}
.wrap.narrow{max-width:900px;text-align:center}.welcome{border-top:0}.welcome h2{font-size:clamp(28px,3.6vw,42px);margin-bottom:0}
.lead{font-size:19px;color:var(--muted);margin:16px auto 0;max-width:62ch}
.mv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px}
.mvbox{background:var(--land);color:#e4f1f2;border-radius:14px;padding:clamp(22px,3vw,36px)}.mvbox h3{color:#fff;margin:0 0 10px;font-size:26px}.mvbox p{margin:0;font-size:17px}
.headcard{display:flex;gap:clamp(18px,3vw,28px);align-items:center;text-decoration:none;color:inherit;margin-top:30px;padding:clamp(18px,2.5vw,28px);border:1px solid var(--line);border-radius:12px;background:var(--card)}
a.headcard:hover{border-color:var(--water)}.headcard .avatar{width:min(var(--hs,140px),32vw);height:min(var(--hs,140px),32vw)}.sizer{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px;color:var(--muted)}.sizer input{flex:1;accent-color:var(--silt);min-height:32px}.headcard .avatar.ph{font-size:44px}.headcard b{display:block;font-size:clamp(18px,calc(var(--hs,140px) / 5.2),40px);font-family:"Source Serif 4",serif;margin:4px 0;line-height:1.15}.headcard .sub{font-size:16px}
.cardname{font-size:clamp(26px,2.6vw,32px);margin:18px 0 6px}
.social{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.contact .chip{background:transparent;color:#fff;border-color:#ffffff55}
.thanks{font-family:"Source Serif 4",serif;font-size:22px;text-align:center;color:#fff;margin:30px 0 0}
.intro{margin-top:clamp(28px,4vw,48px)!important}.about{padding-top:0!important}
/* editing */
.editing [contenteditable]{outline:1px dashed color-mix(in srgb,var(--silt) 70%,transparent);outline-offset:2px;border-radius:3px;min-width:2em;display:inline-block}
.editing [contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7}
.editing .blockedit{display:block}
.del{position:absolute;top:6px;right:6px;min-height:32px;height:32px;padding:0 10px;font-size:13px;color:#b3261e;background:var(--card)}
.rows .del{top:10px;right:0}
.add{margin-top:14px;border-style:dashed;color:var(--water);background:transparent}
.editing [data-photo]{cursor:pointer;outline:3px dashed var(--silt);outline-offset:3px}
.photohint{font-size:13px;color:var(--muted);margin-top:8px}
.editing .rows li{padding-right:84px}
.bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:14px;box-shadow:0 10px 30px #0006;width:min(760px,calc(100% - 24px))}
.bar span{flex:1;font-size:14px;min-width:180px}
.bar button{border:0}
.bar .primary{background:var(--silt);color:#fff;font-weight:600}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:40;max-width:calc(100% - 24px);font-size:15px}
.modal{position:fixed;inset:0;background:#0009;z-index:50;display:grid;place-items:center;padding:16px}
.modal>div{background:var(--card);color:var(--ink);border-radius:12px;padding:20px;width:min(640px,100%)}
.modal textarea{width:100%;height:240px;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.urlrow{font-size:13px;color:var(--muted);display:block}
@media(max-width:820px){.intro{grid-template-columns:minmax(0,1fr);margin-top:-70px}.about{padding-top:0}.card{max-width:420px}}
@media(max-width:600px){.rows li{grid-template-columns:minmax(0,1fr);gap:4px}.brand{font-size:16px}}
@media(max-width:520px){.brand span{display:none}.btn-edit{padding:0 12px}.links a{padding:10px 8px}}

void main(){ vec4 c = texture(q, uv);
